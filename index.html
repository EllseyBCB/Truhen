<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Truhen-Animation · 3D-Prototyp</title>
<style>
  :root {
    --bg-deep: #0c1220;
    --bg-glow: #223052;
    --ink: #e8ecf5;
    --ink-dim: #93a0bd;
    --gold: #ffc94d;
    --gold-deep: #e0a83f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    background: radial-gradient(1200px 800px at 50% 18%, var(--bg-glow), var(--bg-deep) 72%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; }

  .eyebrow {
    margin-top: max(18px, env(safe-area-inset-top));
    font-size: 11px; font-weight: 700; letter-spacing: 0.32em;
    color: var(--ink-dim); text-transform: uppercase;
  }
  .eyebrow b { color: var(--gold); font-weight: 800; }

  #banner {
    position: fixed; left: 50%; top: 16%;
    transform: translateX(-50%) scale(0.6);
    opacity: 0; text-align: center;
    transition: opacity .35s ease, transform .45s cubic-bezier(.18,1.6,.4,1);
  }
  #banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #banner .rarity {
    font-size: clamp(34px, 8vw, 58px); font-weight: 900;
    letter-spacing: 0.14em; line-height: 1;
    color: var(--rarity, var(--gold));
    text-shadow: 0 0 26px color-mix(in srgb, var(--rarity, var(--gold)) 55%, transparent),
                 0 2px 0 rgba(0,0,0,.45);
  }
  #banner .sub {
    margin-top: 10px; font-size: 14px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim);
  }

  #hint {
    position: fixed; left: 50%; bottom: max(9%, calc(24px + env(safe-area-inset-bottom)));
    transform: translateX(-50%);
    padding: 10px 22px; border-radius: 999px;
    background: rgba(10, 16, 30, 0.72);
    border: 1px solid rgba(255, 201, 77, 0.35);
    font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
    color: var(--gold);
    animation: hintPulse 1.6s ease-in-out infinite;
    transition: opacity .25s ease;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  @keyframes hintPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50%      { transform: translateX(-50%) scale(1.06); }
  }

  #againBtn {
    position: fixed; left: 50%; bottom: max(8%, calc(22px + env(safe-area-inset-bottom)));
    transform: translateX(-50%) translateY(24px);
    opacity: 0; pointer-events: none;
    padding: 14px 34px; border: 0; border-radius: 999px;
    background: linear-gradient(180deg, #ffd873, var(--gold-deep));
    box-shadow: 0 4px 0 #9c6a12, 0 10px 26px rgba(224, 168, 63, 0.35);
    color: #3d2600; font-family: inherit;
    font-size: 15px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    transition: opacity .3s ease, transform .3s ease;
  }
  #againBtn.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #againBtn:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #9c6a12, 0 6px 14px rgba(224, 168, 63, 0.3); }

  #flash { position: fixed; inset: 0; background: #fff8e6; opacity: 0; pointer-events: none; }

  /* Demo-Umschalter (nur Vorschau; im Spiel wählst du per window.__chest.loadChest) */
  #switchBtn {
    position: fixed; right: 12px; top: max(12px, env(safe-area-inset-top));
    z-index: 6; padding: 7px 14px; border-radius: 999px;
    background: rgba(10, 16, 30, 0.7); color: var(--ink);
    border: 1px solid rgba(255,255,255,0.18);
    font: 700 12px/1 system-ui, sans-serif; letter-spacing: 0.04em;
    cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #switchBtn:active { transform: translateY(1px); }

  @media (prefers-reduced-motion: reduce) {
    #hint { animation: none; }
  }

  /* ---------- Belohnungs-Abfolge ---------- */
  /* Neue Belohnung erscheint oben-links über der Truhe (#rewardTop),
     fertige Belohnungen sammeln sich als Kärtchen unter der Truhe (#rewardBottom). */
  /* Belohnung erscheint mittig über der Truhe, im Lichtstrahl der Truhe */
  #rewardTop {
    position: fixed; left: 50%; top: 8%;
    transform: translateX(-50%);
    width: 130px; height: 156px;
    pointer-events: none; z-index: 5;
  }
  /* weicher Lichtschein hinter der Karte — das Item liegt „im Licht" */
  #rewardTop::before {
    content: ''; position: absolute;
    left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: 340px; height: 440px;
    background: radial-gradient(ellipse 42% 50% at 50% 50%,
      rgba(214, 234, 255, 0.72), rgba(150, 198, 255, 0.28) 42%, rgba(120,170,255,0) 70%);
    filter: blur(4px); z-index: -1; pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
  }
  #rewardTop.lit::before { opacity: 1; }
  #rewardTop .rcard { position: absolute; top: 0; left: 1px; }
  #rewardBottom {
    position: fixed; left: 50%; bottom: 20%;
    transform: translateX(-50%);
    display: flex; gap: 7px; flex-wrap: nowrap;
    justify-content: center; max-width: 94%;
    pointer-events: none; z-index: 5;
  }
  .rcard {
    width: 128px; padding: 10px 10px 12px;
    border-radius: 18px;
    background: rgba(10, 16, 30, 0.82);
    border: 2px solid var(--rc, #54b6ff);
    box-shadow: 0 0 22px 2px var(--rc, #54b6ff), 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; transform: scale(0.4) translateY(46px);
    transition: opacity .35s ease, transform .5s cubic-bezier(.18,1.7,.4,1);
  }
  .rcard.in { opacity: 1; transform: scale(1) translateY(0); }
  .rcard.flydown { opacity: 0; transform: scale(0.4) translateY(130px); transition: opacity .3s ease, transform .3s ease; }
  .rcard .icon {
    width: 108px; height: 88px; border-radius: 12px;
    background: radial-gradient(circle at 50% 36%, #ffffff, var(--rc, #54b6ff) 60%, #0a1420 100%);
    background-size: cover; background-position: center;
  }
  .rcard .rrar {
    margin-top: 8px; text-align: center;
    font: 800 12px/1 system-ui, sans-serif;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--rc, #54b6ff);
  }
  .rchip {
    width: 48px; padding: 5px; border-radius: 12px;
    background: rgba(10, 16, 30, 0.8);
    border: 1.5px solid var(--rc, #54b6ff);
    box-shadow: 0 0 12px var(--rc, #54b6ff);
    opacity: 0; transform: scale(0.4);
    transition: opacity .25s ease, transform .3s cubic-bezier(.18,1.7,.4,1);
  }
  .rchip.in { opacity: 1; transform: scale(1); }
  .rchip .icon {
    width: 100%; height: 40px; border-radius: 8px;
    background: radial-gradient(circle at 50% 36%, #ffffff, var(--rc, #54b6ff) 60%, #0a1420 100%);
    background-size: cover; background-position: center;
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <div class="hud">
    <div class="eyebrow">Truhen-Prototyp · <b>3D-Demo</b></div>
  </div>
  <div id="banner"><div class="rarity"></div><div class="sub"></div></div>
  <div id="rewardTop"></div>
  <div id="rewardBottom"></div>
  <div id="hint">Tippe die Truhe an!</div>
  <button id="againBtn" type="button">Nochmal öffnen</button>
  <button id="switchBtn" type="button">Truhe wechseln</button>
  <div id="flash"></div>
  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/RoomEnvironment.js"></script>
  <script src="vendor/RoundedBoxGeometry.js"></script>
  <script src="src/chest-model.js"></script>
  <script src="assets/chest-blau.js"></script>
  <script src="assets/chest-silber.js"></script>
  <script src="assets/chest-holz.js"></script>
  <script src="src/chest.js"></script>
  <script>
    // Demo-Umschalter: klickt durch alle registrierten Truhen (nur Vorschau)
    (function () {
      var btn = document.getElementById('switchBtn');
      btn.addEventListener('click', function () {
        var ids = (window.__chest && window.__chest.chests()) || [];
        if (ids.length < 2) return;
        var cur = window.CHEST || ids[0];
        var next = ids[(ids.indexOf(cur) + 1) % ids.length];
        window.__chest.loadChest(next);
      });
    })();
  </script>
</body>
</html>
